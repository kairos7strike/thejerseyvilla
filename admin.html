<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin | The Jersey Villa</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="admin-page">
  <div class="topbar">Staff dashboard · The Jersey Villa</div>
  <div class="admin-wrap">
    <h1>Admin</h1>
    <div class="box" id="loginBox">
      <label>Password</label>
      <input id="password" type="password" placeholder="Admin password">
      <p class="err" id="loginErr"></p>
      <button class="btn btn-auto mt-10" id="loginBtn">Log in</button>
      <p class="muted mt-8">Default password: jerseyvilla2026</p>
    </div>
    <div id="app" class="hidden">
      <div class="tabs">
        <button class="btn" id="tabOrders">Orders</button>
        <button class="btn-outline" id="tabProducts">Products</button>
        <a href="/"><button class="btn-outline">View shop</button></a>
        <button class="btn-outline" id="logoutBtn">Log out</button>
      </div>
      <div id="ordersView" class="box"></div>
      <div id="productsView" class="box hidden"></div>
    </div>
  </div>
  <script src="/admin.js"></script>
</body>
</html>
